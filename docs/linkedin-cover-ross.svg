<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1584" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1425"/>
      <stop offset="60%" stop-color="#111d35"/>
      <stop offset="100%" stop-color="#0e1e3a"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGrad)"/>

  <!-- Subtle stream lines in background (decorative) -->
  <path d="M200 80 Q600 60 1000 90 Q1300 110 1584 85" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.08" fill="none"/>
  <path d="M0 140 Q400 120 800 150 Q1100 170 1584 140" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.06" fill="none"/>
  <path d="M100 260 Q500 240 900 270 Q1200 290 1584 260" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.08" fill="none"/>
  <path d="M0 320 Q350 300 750 330 Q1050 350 1584 320" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.05" fill="none"/>

  <!-- Thin horizontal accent line at top -->
  <rect x="0" y="0" width="1584" height="3" fill="url(#accentLine)"/>

  <!-- Left zone: decorative only (profile photo covers ~0–430px) -->
  <!-- Subtle vertical accent bar -->
  <rect x="440" y="60" width="2" height="276" fill="white" fill-opacity="0.06" rx="1"/>

  <!-- Logo Icon -->
  <rect x="466" y="108" width="120" height="120" rx="22" fill="url(#iconGrad)"/>
  <!-- Stream 1 -->
  <path d="M489 143 H568 M550 130 L568 143 L550 156" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Stream 2 -->
  <path d="M489 168 H576 M558 155 L576 168 L558 181" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Stream 3 -->
  <path d="M489 193 H568 M550 180 L568 193 L550 206" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Divider -->
  <rect x="608" y="108" width="2" height="120" fill="white" fill-opacity="0.1" rx="1"/>

  <!-- Text content -->
  <text x="632" y="158" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1.5">StreamOps AI</text>
  <text x="634" y="194" font-size="21" font-weight="500" fill="#60a5fa" letter-spacing="0.3">AI Automation for Xero</text>
  <text x="634" y="222" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">Founder &amp; Director</text>

  <!-- Bottom name/contact — shifted right of profile photo -->
  <text x="466" y="322" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Ross McDowall</text>
  <text x="466" y="354" font-size="14" font-weight="400" fill="#64748b" letter-spacing="0.3">ross@streamopsai.com.au  ·  streamopsai.com.au</text>

  <!-- Bottom right: CTA pill -->
  <rect x="1330" y="310" width="210" height="52" rx="26" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="1435" y="340" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">Free Audit Available</text>
  <text x="1435" y="356" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">streamopsai.com.au</text>

  <!-- Thin accent line at bottom -->
  <rect x="0" y="393" width="1584" height="3" fill="url(#accentLine)"/>
</svg>
